[project]
name = "yt-scout"
version = "0.1.0"
description = "MCP server: research a YouTube channel with Claude + Gemini"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "google-genai==2.28.0",
    "youtube-transcript-api==1.2.4",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[project.scripts]
yt-scout = "yt_scout.server:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real YouTube/Gemini APIs; needs keys in .env"]
addopts = "-m 'not live'"
